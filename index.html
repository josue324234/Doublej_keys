<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doublej Keys</title>
    <style>
        body { background-color: #121215; color: white; font-family: sans-serif; text-align: center; padding-top: 60px; margin: 0; }
        button { padding: 15px 30px; background-color: #b432dc; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; }
        #keyBox { margin-top: 30px; font-size: 18px; color: #ff5555; word-break: break-all; padding: 0 20px; }
    </style>
</head>
<body>
    <h1>Doublej Hub</h1>
    <p>Presiona el botón para generar tu llave de acceso:</p>
    
    <button onclick="generarLlave()">Generar Llave</button>
    
    <div id="keyBox"></div>

    <script>
        async function generarLlave() {
            const url = 'https://fxebqmelsmwdivpeciwt.supabase.co/rest/v1/keys';
            const apiKey = 'Sb_publishable_OWssYTC1zTiqp99QjXuCEA_yaymVhBd';
            
            const randomKey = "JJ-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            const now = Date.now();

            document.getElementById('keyBox').style.color = "#ffcc00";
            document.getElementById('keyBox').innerText = "Generando...";

            try {
                let respuesta = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'apikey': apiKey,
                        'Authorization': 'Bearer ' + apiKey,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        key: randomKey,
                        created_at: now,
                        hwid: ""
                    })
                });

                if (respuesta.ok) {
                    document.getElementById('keyBox').style.color = "#10ff10";
                    document.getElementById('keyBox').innerHTML = `Tu llave es:<br><b style="background:#222; padding:10px; display:inline-block; margin-top:10px; border-radius:5px;">${randomKey}</b>`;
                } else {
                    let errorDetalle = await respuesta.text();
                    document.getElementById('keyBox').style.color = "#ff5555";
                    document.getElementById('keyBox').innerText = "Error: " + errorDetalle;
                }
            } catch (e) {
                document.getElementById('keyBox').style.color = "#ff5555";
                document.getElementById('keyBox').innerText = "Error de red: " + e.message;
            }
        }
    </script>
</body>
</html>
