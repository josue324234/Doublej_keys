<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doublej Keys - Generador Rojo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #080808;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #121212;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(255, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #330000;
        }
        h1 {
            color: #ff3333;
            margin-bottom: 10px;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(135deg, #cc0000, #990000);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            width: 100%;
            box-shadow: 0 4px 10px rgba(204, 0, 0, 0.4);
        }
        .btn:hover {
            transform: scale(1.03);
            background: linear-gradient(135deg, #ff3333, #cc0000);
            box-shadow: 0 6px 15px rgba(255, 51, 51, 0.6);
        }
        .btn:active {
            transform: scale(0.98);
        }
        #keyBox {
            margin-top: 25px;
            word-break: break-all;
            font-size: 15px;
            min-height: 60px;
        }
        .key-display {
            background: #000000;
            border: 1px solid #660000;
            padding: 12px;
            border-radius: 8px;
            color: #ff4444;
            font-family: monospace;
            font-size: 17px;
            margin-top: 10px;
            font-weight: bold;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Doublej Security</h1>
        <p>Verificación de acceso para el script de Roblox.</p>
        
        <button class="btn" onclick="generarLlave()">Generar Llave de Acceso</button>
        
        <div id="keyBox"></div>
    </div>

    <script>
        async function generarLlave() {
            const url = 'https://fxebqmelsmwdivpeciwt.supabase.co/rest/v1/keys';
            const apiKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4ZWJxbWVsc213ZGl2cGVjaXd0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzU2NjA1MywiZXhwIjoyMTAzMTQyMDUzfQ.LT2dzE1NxCF9L9qame__4dEPS1UkH5bsQg43zArj5Gc';
            
            // Generamos un número aleatorio puro para que encaje con la columna numérica de Supabase
            const randomKey = Math.floor(100000 + Math.random() * 900000);

            const keyBox = document.getElementById('keyBox');
            keyBox.innerHTML = '<p class="status-msg" style="color:#ff9999;">Conectando con la base de datos segura...</p>';

            try {
                let respuesta = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'apikey': apiKey,
                        'Authorization': 'Bearer ' + apiKey,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        key: randomKey,
                        hwid: "ninguno"
                    })
                });

                if (respuesta.ok) {
                    keyBox.innerHTML = `
                        Tu llave generada:
                        <div class="key-display">${randomKey}</div>
                        <p class="status-msg" style="color:#ff6666;">Copia esta llave antes de cerrar la página.</p>
                    `;
                } else {
                    let errorText = await respuesta.text();
                    keyBox.innerHTML = `<p class="status-msg" style="color:#ff4444; font-weight:bold;">Error de Base de Datos:</p><p style="font-size:10px; color:#999;">${errorText.substring(0,100)}</p>`;
                }
            } catch (e) {
                keyBox.innerHTML = `<p class="status-msg" style="color:#ff4444; font-weight:bold;">Error de Red: Verifica tu conexión a internet.</p>`;
            }
        }
    </script>
</body>
</html>
